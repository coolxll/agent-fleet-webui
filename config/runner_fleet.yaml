# ==============================================================================
# Runner Fleet 声明式配置文件 (Desired State Configuration)
# ==============================================================================
#
# 架构原则：
# 1. 纯出站安全（Outbound Only）：所有 Runner 仅主动发起出站长轮询，宿主机严禁暴露任何公网入站端口。
# 2. 差异化抽象：每台机器的代理、用户名、工作目录在 hosts 中统一固化，杜绝配置漂移与遗忘。
# 3. 期望矩阵驱动：pools 中声明「哪个仓库期望在哪些主机提供算力」，由 sync 命令全自动对齐自愈。
#

hosts:
  runner-node-01:
    description: "高性能内网算力机 (Ubuntu 24.04 容器)"
    user: "devuser"
    proxy: "http://127.0.0.1:8118"
    labels: ["self-hosted", "Linux", "X64", "runner-node-01"]
    max_runners: 6

  runner-node-02:
    description: "开发工作站 / 日常开发机 (复用 runner-node-01 Tailscale SOCKS5 代理)"
    user: "devuser"
    proxy: "socks5://100.64.0.1:1080"
    labels: ["self-hosted", "Linux", "X64", "runner-node-02"]
    max_runners: 2

# ==============================================================================
# 期望运行矩阵 (Pools: repo -> target hosts)
# ==============================================================================
pools:
  coolxll/agent-fleet-webui:
    - runner-node-01
    - runner-node-02
