# ==============================================================================
# Runner Fleet 声明式配置文件 (Desired State Configuration)
# ==============================================================================
#
# 架构原则：
# 1. 纯出站安全（Outbound Only）：所有 Runner 仅主动发起出站长轮询，宿主机严禁暴露任何公网入站端口。
# 2. 差异化抽象：每台机器的代理、用户名、工作目录在 hosts 中统一固化，杜绝配置漂移与遗忘。
# 3. 期望矩阵驱动：pools 中声明「哪个仓库期望在哪些主机提供算力」，由 sync 命令全自动对齐自愈。
#

hosts:
  corp172-dev:
    description: "24c / 64G 高性能内网算力机 (Ubuntu 24.04 容器)"
    user: "lynn"
    proxy: "http://127.0.0.1:8118"
    labels: ["self-hosted", "Linux", "X64", "corp172-dev"]
    max_runners: 6

  x13:
    description: "Ubuntu Kubuntu 工作站 / 日常开发机 (复用 corp172-dev Tailscale SOCKS5 代理)"
    user: "lynns"
    proxy: "socks5://100.93.132.98:1080"
    labels: ["self-hosted", "Linux", "X64", "x13"]
    max_runners: 2

  # --- 备选/扩容池（见 computer-playground/machines/work/compute-node-expansion-plan.md） ---
  # corp102-72-dev:
  #   description: "24c / 64G / 400G 原生 CentOS Stream 9 现代内核大算力机"
  #   user: "lynn"
  #   proxy: ""
  #   labels: ["self-hosted", "Linux", "X64", "corp102-72-dev"]
  #   max_runners: 6

# ==============================================================================
# 期望运行矩阵 (Pools: repo -> target hosts)
# ==============================================================================
pools:
  coolxll/agent-fleet-webui:
    - corp172-dev
    - x13

  coolxll/EmbyMetaInfo:
    - corp172-dev
