services:
  agent-fleet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_FLEET_VERSION: 0.2.0-dev
        AGENT_FLEET_COMMIT: dev
    container_name: agent-fleet-webui
    ports:
      - "8000:8000"
    environment:
      - AGENT_FLEET_HOST=0.0.0.0
      - AGENT_FLEET_PORT=8000
      - AGENT_FLEET_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ~/.ssh:/root/.ssh:ro
    restart: unless-stopped
