# Agent Fleet inventory (project format).
#
# Sources are merged; later entries only fill gaps left by earlier ones.
# The OpenSSH client config (~/.ssh/config) is always read as well, so every
# ssh alias you already have shows up automatically.
#
# kind: macos | linux | windows | wsl | auto
#
# WSL distros are NOT declared here. They are reachable through their own SSH
# endpoints (wujie, r9kp-wsl), which already appear as runtimes.

hosts:
  - name: local-controller
    kind: macos
    tags:
      role: controller

  # Windows hosts: only the native PowerShell runtime is probed.
  - name: r9kp-win
    kind: windows

  - name: wujie-win
    kind: windows

  - name: k14-win
    kind: windows

  # Direct WSL endpoints (sshd running inside the distro): plain POSIX targets
  - name: r9kp-wsl
    kind: wsl
  - name: wujie
    kind: wsl

  - name: rn-direct
    kind: linux
    tags:
      role: worker
  - name: x13
    kind: linux
  - name: k14
    kind: linux
  - name: corp172-dev
    kind: linux

# Hosts that exist in ~/.ssh/config but are not part of the fleet.
# Exclusions win over every other source.
exclude:
  - corp172
  - ddrk
  - jph2
  - la-tri
  - pve
  - r9u
  - racknerd
