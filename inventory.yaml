# Agent Fleet inventory (project format).
#
# Sources are merged; later entries only fill gaps left by earlier ones.
# The OpenSSH client config (~/.ssh/config) is always read as well, so every
# ssh alias you already have shows up automatically. This file exists to add
# what SSH config cannot express: runtime kind hints and WSL distros.
#
# kind: macos | linux | windows | wsl | auto
#
# NOTE: WSL distros are NOT declared here. They are reachable through their own
# SSH endpoints (wujie, r9kp-wsl, ...), which already appear as runtimes.
# Declaring them again under the Windows host would duplicate them.
# Set AGENT_FLEET_DISCOVER_WSL=true if you ever want the wsl.exe route instead.

hosts:
  - name: local-controller
    kind: macos
    tags:
      role: controller

  # Windows hosts: only the native PowerShell runtime is probed.
  - name: r9kp-win
    kind: windows

  - name: wujie-win
    kind: windows

  - name: k14-win
    kind: windows

  # Direct WSL endpoints (sshd running inside the distro): plain POSIX targets
  - name: r9kp-wsl
    kind: wsl
  - name: wujie
    kind: wsl

  - name: rn-direct
    kind: linux
    tags:
      role: worker
  - name: x13
    kind: linux
  - name: k14
    kind: linux
  - name: la-tri
    kind: linux
  - name: jph2
    kind: linux
  - name: ddrk
    kind: linux
  - name: corp172-dev
    kind: linux
