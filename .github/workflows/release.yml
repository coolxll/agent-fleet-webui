name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0; defaults to current ref if empty)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run: build and verify all artifacts without publishing to GHCR or Releases'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 0. Resolve & Validate Release Metadata Gate
  # =========================================================================
  resolve-metadata:
    name: Resolve & Validate Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      semver: ${{ steps.meta.outputs.semver }}
      git_ref: ${{ steps.meta.outputs.git_ref }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      build_time: ${{ steps.meta.outputs.build_time }}
      is_dry_run: ${{ steps.meta.outputs.is_dry_run }}

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Tag, Commit Ref, and Validation
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
              echo "::error::Tag name '${TAG}' does not match required format 'v[0-9]+.[0-9]+.[0-9]+*'"
              exit 1
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.2.0-dev"
          fi

          SEMVER="${TAG#v}"

          # Resolve target git ref and commit SHA ensuring tag consistency
          GIT_REF="${{ github.ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
              TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
              echo "Existing tag ${TAG} found at commit ${TAG_COMMIT}. Checking out exact tag ref."
              GIT_REF="refs/tags/${TAG}"
              COMMIT_SHA="${TAG_COMMIT}"
            else
              echo "Tag ${TAG} not yet present in repository; ensuring commit SHA matches current dispatch HEAD."
              GIT_REF="${{ github.sha }}"
              COMMIT_SHA="${{ github.sha }}"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            GIT_REF="${{ github.ref }}"
            COMMIT_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          else
            GIT_REF="${{ github.sha }}"
            COMMIT_SHA="$(git rev-parse HEAD)"
          fi

          IS_DRY_RUN="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            IS_DRY_RUN="true"
          elif [[ "${{ github.ref }}" != refs/tags/v* ]] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            IS_DRY_RUN="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.tag_name }}" ]; then
            IS_DRY_RUN="true"
          fi

          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "git_ref=${GIT_REF}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "is_dry_run=${IS_DRY_RUN}" >> "$GITHUB_OUTPUT"

          echo "=== Release Metadata Resolved ==="
          echo "Release Tag: ${TAG} (SemVer: ${SEMVER})"
          echo "Git Ref:     ${GIT_REF}"
          echo "Commit SHA:  ${COMMIT_SHA}"
          echo "Build Time:  ${BUILD_TIME}"
          echo "Dry Run:     ${IS_DRY_RUN}"

  # =========================================================================
  # 1. Quality & Pre-Release Test Gate
  # =========================================================================
  test-gate:
    name: Pre-release Test Gate
    needs: [resolve-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-metadata.outputs.git_ref }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          uv pip install -r backend/requirements.txt

      - name: Run Backend Tests
        run: |
          export PYTHONPATH=backend
          uv run pytest tests/ -n auto --dist=loadscope -q

      - name: Setup Node.js 22 & Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci

      - name: Run Frontend Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Build Frontend Assets
        run: |
          cd web
          npm run build

  # =========================================================================
  # 2. Build & Package Integrated Release Artifacts
  # =========================================================================
  build-artifacts:
    name: Build & Package Release Artifacts
    needs: [resolve-metadata, test-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-metadata.outputs.git_ref }}
          fetch-depth: 0

      - name: Setup Node.js 22 & Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup uv & Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          cd web && npm ci
          cd ..
          uv pip install -r backend/requirements.txt

      - name: Execute Release Build Script
        env:
          AGENT_FLEET_COMMIT_SHA: ${{ needs.resolve-metadata.outputs.commit_sha }}
          AGENT_FLEET_BUILD_TIME: ${{ needs.resolve-metadata.outputs.build_time }}
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh "${{ needs.resolve-metadata.outputs.release_tag }}" --output-dir dist

      - name: Upload Distributable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ needs.resolve-metadata.outputs.release_tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 3. Build & Publish Multi-Stage Docker Container Image
  # =========================================================================
  docker-image:
    name: Build & Publish Container Image
    needs: [resolve-metadata, test-gate, build-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-metadata.outputs.git_ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ needs.resolve-metadata.outputs.is_dry_run == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.resolve-metadata.outputs.release_tag }}
            type=raw,value=${{ needs.resolve-metadata.outputs.semver }}
            type=raw,value=latest,enable=${{ needs.resolve-metadata.outputs.is_dry_run == 'false' }}

      - name: Build Local Test Image for Smoke Testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: agent-fleet-smoke:test
          build-args: |
            AGENT_FLEET_VERSION=${{ needs.resolve-metadata.outputs.semver }}
            AGENT_FLEET_COMMIT=${{ needs.resolve-metadata.outputs.commit_sha }}
            BUILD_TIME=${{ needs.resolve-metadata.outputs.build_time }}
          cache-from: type=gha

      - name: Smoke Test Built Container
        run: |
          docker run -d --name smoke-test -p 8000:8000 agent-fleet-smoke:test
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Container responded after $i seconds."
              break
            fi
            sleep 1
          done
          python3 -c "
          import json, sys, urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5) as r:
                  assert r.status == 200, f'Health status: {r.status}'
                  h = json.loads(r.read().decode())
                  assert h.get('ok') is True, f'Health ok != True: {h}'
                  assert h.get('service') == 'agent-fleet', f'Health service != agent-fleet: {h}'
                  print('✓ Health check passed:', h)
              with urllib.request.urlopen('http://127.0.0.1:8000/api/system/version', timeout=5) as r:
                  assert r.status == 200, f'Version status: {r.status}'
                  v = json.loads(r.read().decode())
                  assert v.get('version') == '${{ needs.resolve-metadata.outputs.semver }}', f'Version mismatch: {v}'
                  assert 'commit' in v, f'Missing commit in: {v}'
                  assert 'commit_short' in v, f'Missing commit_short in: {v}'
                  assert 'is_release' in v, f'Missing is_release in: {v}'
                  print('✓ Version check passed:', v)
          except Exception as e:
              print(f'Smoke test assertion failed: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Cleanup Smoke Test Container
        if: always()
        run: |
          docker stop smoke-test || true
          docker rm smoke-test || true

      - name: Build & Push Multi-Arch Docker Image
        if: ${{ needs.resolve-metadata.outputs.is_dry_run == 'false' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            AGENT_FLEET_VERSION=${{ needs.resolve-metadata.outputs.semver }}
            AGENT_FLEET_COMMIT=${{ needs.resolve-metadata.outputs.commit_sha }}
            BUILD_TIME=${{ needs.resolve-metadata.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Multi-Arch Build (Dry Run)
        if: ${{ needs.resolve-metadata.outputs.is_dry_run == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            AGENT_FLEET_VERSION=${{ needs.resolve-metadata.outputs.semver }}
            AGENT_FLEET_COMMIT=${{ needs.resolve-metadata.outputs.commit_sha }}
            BUILD_TIME=${{ needs.resolve-metadata.outputs.build_time }}
          cache-from: type=gha

  # =========================================================================
  # 4. Publish GitHub Release with Release Notes & Assets
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [resolve-metadata, build-artifacts, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-metadata.outputs.git_ref }}
          fetch-depth: 0

      - name: Download Staged Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.resolve-metadata.outputs.release_tag }}
          path: dist

      - name: Generate Release Notes Draft Template
        id: notes
        run: |
          TAG="${{ needs.resolve-metadata.outputs.release_tag }}"
          SEMVER="${{ needs.resolve-metadata.outputs.semver }}"
          REPO="${{ github.repository }}"

          # Derive schema version from codebase AST
          SCHEMA_VERSION=$(python3 -c "
          import ast
          schema_ver = 1
          try:
              tree = ast.parse(open('backend/agent_fleet/db.py', encoding='utf-8').read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == 'MIGRATIONS':
                              if isinstance(node.value, ast.List):
                                  vers = [elt.elts[0].value for elt in node.value.elts if isinstance(elt, ast.Tuple) and hasattr(elt.elts[0], 'value')]
                                  if vers:
                                      schema_ver = max(vers)
          except Exception:
              pass
          print(schema_ver)
          " 2>/dev/null || echo "1")

          echo "Derived schema version: ${SCHEMA_VERSION}"

          cat << 'EOF' > release_notes.md
          ## 📦 What's Changed
          EOF

          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### Commits since ${PREV_TAG}" >> release_notes.md
            git log "${PREV_TAG}..${TAG}" --oneline --no-merges | sed 's/^/- /' >> release_notes.md 2>/dev/null || true
          else
            echo "### Included Commits" >> release_notes.md
            git log -n 20 --oneline --no-merges | sed 's/^/- /' >> release_notes.md 2>/dev/null || true
          fi

          cat << EOF >> release_notes.md

          ### ⚠️ Breaking Changes
          - None in this release.

          ### 🔄 Database & Migration Notes
          - Current Schema Version: **${SCHEMA_VERSION}**
          - Database schema migrations run automatically on startup via SQLite \`PRAGMA user_version = ${SCHEMA_VERSION}\`.
          - **Pre-upgrade Backup**: Before updating existing deployments, always create a point-in-time verified backup:
            \`\`\`bash
            python -m agent_fleet.cli backup
            \`\`\`

          ### 📥 Installation & Artifacts

          #### Checksum Verification (SHA-256)
          \`\`\`bash
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/agent-fleet-${TAG}.tar.gz
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          #### Standalone Tarball
          \`\`\`bash
          tar -xzf agent-fleet-${TAG}.tar.gz
          cd agent-fleet-${TAG}
          ./start.sh
          \`\`\`

          #### Multi-stage Docker Container
          \`\`\`bash
          docker pull ghcr.io/${REPO}:${TAG}
          docker run -d -p 8000:8000 -v agent_fleet_data:/app/data --name agent-fleet ghcr.io/${REPO}:${TAG}
          \`\`\`

          ### ⏪ Rollback & Recovery Runbook
          If any regression occurs during deployment:
          1. Stop running service:
             \`\`\`bash
             docker stop agent-fleet || pkill -f "uvicorn agent_fleet.main:app"
             \`\`\`
          2. Restore database from pre-upgrade backup snapshot:
             \`\`\`bash
             python -m agent_fleet.cli restore data/backups/fleet_backup_<timestamp>.db
             \`\`\`
          3. Consult [docs/recovery-guide.md](docs/recovery-guide.md) and [docs/release-runbook.md](docs/release-runbook.md) for full emergency procedures.
          EOF

          echo "Generated release notes:"
          cat release_notes.md

      - name: Publish GitHub Release
        if: ${{ needs.resolve-metadata.outputs.is_dry_run == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-metadata.outputs.release_tag }}
          target_commitish: ${{ needs.resolve-metadata.outputs.commit_sha }}
          name: Agent Fleet Explorer ${{ needs.resolve-metadata.outputs.release_tag }}
          body_path: release_notes.md
          files: |
            dist/agent-fleet-*.tar.gz
            dist/agent-fleet-*.zip
            dist/SHA256SUMS
          draft: false
          prerelease: false

      - name: Dry Run Summary
        if: ${{ needs.resolve-metadata.outputs.is_dry_run == 'true' }}
        run: |
          echo "=== DRY RUN RELEASE BUILD COMPLETED ==="
          echo "Tag: ${{ needs.resolve-metadata.outputs.release_tag }}"
          echo "Commit: ${{ needs.resolve-metadata.outputs.commit_sha }}"
          echo "Artifacts generated in dist/:"
          ls -la dist/
          echo "SHA256 Checksums:"
          cat dist/SHA256SUMS
          echo "Publishing was skipped as requested by dry_run mode."
