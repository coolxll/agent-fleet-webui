name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Pytest (434 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          uv venv .venv
          uv pip install -r backend/requirements.txt

      - name: Run Backend Tests (Parallel via pytest-xdist)
        run: |
          export PYTHONPATH=backend
          .venv/bin/python -m pytest tests/ -n auto --dist=loadscope -q

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci

      - name: Run Frontend Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Build Frontend Assets
        run: |
          cd web
          npm run build
