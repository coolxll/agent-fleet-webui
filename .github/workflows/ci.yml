name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Pytest (434 tests)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      HTTP_PROXY: http://127.0.0.1:8118
      HTTPS_PROXY: http://127.0.0.1:8118
      ALL_PROXY: http://127.0.0.1:8118
      NO_PROXY: "localhost,127.0.0.1,100.*,10.*"
      UV_CACHE_DIR: /tmp/.uv-cache
      UV_LINK_MODE: copy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Backend Environment (Python 3.13 via uv)
        run: |
          uv venv .venv --python 3.13
          uv pip install -r backend/requirements.txt

      - name: Run Backend Tests (Parallel via pytest-xdist)
        run: |
          export PYTHONPATH=backend
          .venv/bin/python -m pytest tests/ -n auto --dist=loadscope -q

  frontend:
    name: Frontend Typecheck & Build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      HTTP_PROXY: http://127.0.0.1:8118
      HTTPS_PROXY: http://127.0.0.1:8118
      ALL_PROXY: http://127.0.0.1:8118
      NO_PROXY: "localhost,127.0.0.1,100.*,10.*"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 & Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Run Frontend Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Build Frontend Assets
        run: |
          cd web
          npm run build
